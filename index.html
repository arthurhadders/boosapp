<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoosApp — praat met de avatar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BoosApp">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #f3f5fa;
      --panel: #ffffff;
      --text: #1a1a1f;
      --muted: #6b7280;
      --accent: #6366f1;
      --soft: #e5e7eb;
      --shadow: 0 10px 30px rgba(20, 20, 60, 0.08);
    }
    [data-theme="dark"] {
      --bg: #0e1117;
      --panel: #1a1f2b;
      --text: #f1f3f8;
      --muted: #9aa3b2;
      --accent: #8b8cf2;
      --soft: #2a313f;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .3s, color .3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; max-width: 720px; margin: 0 auto; width: 100%;
    }
    h1 { font-size: 1.4rem; margin: 0; letter-spacing: -.5px; }
    .header-actions { display: flex; gap: 8px; }
    .theme-btn {
      background: var(--panel); border: 1px solid var(--soft);
      color: var(--text); border-radius: 999px; padding: 8px 14px;
      cursor: pointer; font-size: .9rem; box-shadow: var(--shadow);
    }
    .icon-only { padding: 8px 12px; }
    main {
      flex: 1; max-width: 720px; margin: 0 auto; width: 100%;
      padding: 0 20px 32px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .card {
      background: var(--panel); border-radius: 20px;
      padding: 18px; box-shadow: var(--shadow);
      animation: fadeIn .4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* avatar */
    .avatar-wrap { display: flex; justify-content: center; padding: 20px; }
    .avatar { width: 200px; height: 200px; }
    .face { fill: #ffd9a5; transition: fill .4s; }
    body[data-mode="boos"] .face { fill: #ffb39a; }
    body[data-mode="schelden"] .face { fill: #ff8e7a; }
    .eye { fill: #1a1a1f; transition: all .3s; }
    .brow { stroke: #1a1a1f; stroke-width: 5; fill: none; stroke-linecap: round; transition: all .3s; }
    .mouth {
      fill: #5a2a2a;
      transition: ry .08s ease-out, rx .3s;
    }
    .avatar.speaking { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2px); }
    }

    /* chat-bubbels */
    .chat {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 55vh; overflow-y: auto;
      scroll-behavior: smooth;
      padding: 2px;
    }
    .chat:empty { display: none; }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 1.05rem;
      line-height: 1.45;
      word-wrap: break-word;
      animation: bubbleIn .25s ease-out;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bg);
      border: 1px solid var(--soft);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.typing { color: var(--muted); padding: 12px 14px; }
    .empty-state {
      padding: 8px 4px;
      color: var(--muted);
      font-style: italic;
    }
    .empty-state.hidden { display: none; }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* input */
    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--soft); background: var(--bg); color: var(--text);
      font-size: 1rem; outline: none; transition: border-color .2s;
    }
    .input-row input:focus { border-color: var(--accent); }

    .btn {
      padding: 12px 18px; border-radius: 12px; border: none;
      background: var(--accent); color: white; cursor: pointer;
      font-size: 1rem; font-weight: 600;
      transition: transform .1s, opacity .2s;
    }
    .btn:hover { opacity: .92; }
    .btn:active { transform: scale(.97); }
    .btn.icon { padding: 12px 14px; font-size: 1.1rem; }
    .mic { background: #ef4444; }
    .mic.listening { animation: pulse 1.1s infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.55); }
      50%     { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--soft); background: var(--bg);
      color: var(--text); cursor: pointer; font-size: .92rem;
      transition: all .2s;
    }
    .chip:hover { transform: translateY(-1px); }
    .chip.active {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .label { font-size: .82rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }

    /* voorbeelden bij lege staat */
    .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .examples.hidden { display: none; }
    .example {
      background: var(--soft); color: var(--text);
      border: 1px dashed var(--muted); border-radius: 999px;
      padding: 6px 12px; font-size: .85rem;
      cursor: pointer; transition: opacity .2s, transform .1s;
    }
    .example:hover { opacity: .85; transform: translateY(-1px); }

    /* instellingen */
    .settings-toggle {
      background: var(--soft); color: var(--text); border: none;
      border-radius: 12px; padding: 12px 16px; cursor: pointer;
      width: 100%; font-size: 1rem; text-align: left;
      display: flex; justify-content: space-between; align-items: center;
    }
    .settings-body { padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
    .settings-body.hidden { display: none; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: .85rem; color: var(--muted); }
    .field input, .field select {
      padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--soft); background: var(--bg); color: var(--text);
      font-size: .95rem; outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch {
      width: 44px; height: 26px; background: var(--soft); border-radius: 999px;
      position: relative; cursor: pointer; transition: background .2s;
      flex-shrink: 0; border: none; padding: 0;
    }
    .switch::after {
      content: ''; width: 20px; height: 20px; background: white;
      border-radius: 50%; position: absolute; top: 3px; left: 3px;
      transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(18px); }
    .btn.small { padding: 8px 12px; font-size: .85rem; }
    .btn.danger { background: #ef4444; }
    .help { font-size: .8rem; color: var(--muted); line-height: 1.4; }
    .help a { color: var(--accent); }
    .dots { display: inline-block; min-width: 24px; }
    .dots::after { content: '...'; animation: dots 1.2s infinite steps(4, end); }
    @keyframes dots {
      0%        { content: ''; }
      25%       { content: '.'; }
      50%       { content: '..'; }
      75%, 100% { content: '...'; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.1rem; }
      .avatar { width: 160px; height: 160px; }
      .response { font-size: 1.05rem; }
      .btn { padding: 12px 14px; font-size: .95rem; }
    }
  </style>
</head>

    <div class="card">

      </div>
    </div>

    <div class="card">
      <div class="label" data-i18n="label_language">Taal</div>
      <div class="chips" id="languageChips">

    </div>

    <div class="card">
      <div class="label" data-i18n="label_mode">Mode</div>
      <div class="chips" id="modeChips">
        <button class="chip active" data-mode="lief"     data-i18n="mode_lief">😊 Lief</button>
        <button class="chip"        data-mode="boos"     data-i18n="mode_boos">😤 Boos</button>
        <button class="chip"        data-mode="schelden" data-i18n="mode_schelden">🤬 Scheldwoorden</button>
      </div>
    </div>

    <div class="card">
      <div class="label" data-i18n="label_voice">Stem</div>
      <div class="chips" id="voiceChips">
        <button class="chip"        data-voice="meisje" data-i18n="voice_meisje">👧 Meisje</button>
        <button class="chip"        data-voice="jongen" data-i18n="voice_jongen">👦 Jongen</button>
        <button class="chip active" data-voice="vrouw"  data-i18n="voice_vrouw">👩 Vrouw</button>
        <button class="chip"        data-voice="man"    data-i18n="voice_man">👨 Man</button>
      </div>
    </div>

    <div class="card">
      <button class="settings-toggle" id="settingsToggle">
        <span data-i18n="settings_title">⚙️ Instellingen</span>
        <span id="settingsArrow">▾</span>
      </button>
      <div class="settings-body hidden" id="settingsBody">
        <div class="row">
          <label for="aiToggle" data-i18n="settings_ai_label">AI-modus (echte gesprekken)</label>
          <button class="switch" id="aiToggle" role="switch" aria-checked="false" aria-label="AI"></button>
        </div>
        <div class="field">
          <label for="apiKey" data-i18n="settings_apikey_label">Claude API-key</label>
          <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
          <div class="help" data-i18n="settings_apikey_help">
            Maak er gratis een aan op <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> (Settings → API Keys).
            De key wordt alleen op dit apparaat opgeslagen.
          </div>
        </div>
        <div class="field">
          <label for="modelSelect" data-i18n="settings_model_label">Model</label>

        </div>
        <button class="btn small danger" id="clearChat" data-i18n="btn_clear">🗑️ Wis gesprek-geheugen</button>
      </div>
    </div>

    function detectTheme(text, lang) {
      if (!text) return null;
      const tokens = text.toLowerCase().split(/[\s.,!?;:'"„""()\-—]+/).filter(Boolean);
      for (const [name, langs] of Object.entries(themes)) {
        const kws = langs[lang] || langs.en || langs.nl || [];
        for (const k of kws) {
          if (k.length <= 3) {
            if (tokens.includes(k)) return name;
          } else {
            if (tokens.some(t => t.startsWith(k))) return name;
          }
        }
      }
      return null;
    }

      const tb = document.getElementById("themeBtn");
      if (tb) tb.textContent = (state.theme === "light") ? T.theme_dark : T.theme_light;
      const musb = document.getElementById("musicBtn");
      if (musb) musb.title = musicOn ? T.music_on_title : T.music_off_title;
      document.documentElement.lang = state.language;
      renderExamples();
    }

    function renderExamples() {
      const ex = document.getElementById("examples");
      const chatEl = document.getElementById("chat");
      if (!ex || !chatEl) return;
      if (chatEl.children.length > 0) {
        ex.classList.add("hidden");
        return;
      }
      ex.classList.remove("hidden");
      ex.innerHTML = "";
      (T.examples || []).forEach(text => {
        const b = document.createElement("button");
        b.className = "example";
        b.textContent = text;
        b.addEventListener("click", () => {
          document.getElementById("userInput").value = "";
          reply(text);
        });
        ex.appendChild(b);
      });
    }

    const $ = (id) => document.getElementById(id);
    const avatar = $("avatar");

    // Donker / licht
    $("themeBtn").addEventListener("click", () => {
      state.theme = state.theme === "light" ? "dark" : "light";
      document.body.dataset.theme = state.theme;
      $("themeBtn").textContent = state.theme === "light" ? T.theme_dark : T.theme_light;
      savePrefs();
    });

    // Knoppen-rijtjes (mode / stem)
    function setupChips(containerId, attr, onChange) {
      const container = $(containerId);
      container.addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        container.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        onChange(chip.dataset[attr]);
      });
    }
    setupChips("modeChips", "mode", (m) => {
      state.mode = m;
      document.body.dataset.mode = m;
      updateFace();
      savePrefs();
    });
    setupChips("voiceChips", "voice", (v) => { state.voice = v; savePrefs(); });
    setupChips("languageChips", "language", (l) => { state.language = l; applyUI(); savePrefs(); });

    function syncActiveChip(containerId, attr, value) {
      document.querySelectorAll("#" + containerId + " .chip").forEach(c => {
        c.classList.toggle("active", c.dataset[attr] === value);
      });
    }
    syncActiveChip("modeChips", "mode", state.mode);
    syncActiveChip("voiceChips", "voice", state.voice);
    syncActiveChip("languageChips", "language", state.language);

    // Gezichtsuitdrukking per mode
    function updateFace() {
      const browL = $("browL"), browR = $("browR"), mouth = $("mouth");
      if (state.mode === "lief") {
        browL.setAttribute("d", "M 60 72 Q 75 67 90 72");
        browR.setAttribute("d", "M 110 72 Q 125 67 140 72");
        mouth.setAttribute("rx", "18"); mouth.setAttribute("ry", "6");
      } else if (state.mode === "boos") {
        browL.setAttribute("d", "M 60 65 L 90 78");
        browR.setAttribute("d", "M 110 78 L 140 65");
        mouth.setAttribute("rx", "22"); mouth.setAttribute("ry", "5");
      } else {
        browL.setAttribute("d", "M 56 60 L 92 80");
        browR.setAttribute("d", "M 108 80 L 144 60");
        mouth.setAttribute("rx", "26"); mouth.setAttribute("ry", "10");
      }
    }
    updateFace();

    // Stemmen laden (browser laadt ze asynchroon)
    function loadVoices() { state.voices = speechSynthesis.getVoices(); }
    loadVoices();
    if (typeof speechSynthesis !== "undefined") {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickVoice(name) {
      const prefix = state.language;
      const inLang = state.voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      const pool = inLang.length ? inLang : state.voices;
      const wantsFemale = name === "meisje" || name === "vrouw";
      const candidates = pool.filter(v => {
        const n = v.name.toLowerCase();
        if (wantsFemale) return /female|vrouw|fem|woman|girl|anna|lotte|claire|hanna|saskia|ellen|samantha|karen|amelie|amélie|audrey|marie|petra|katrin/.test(n);
        return /male|man|jongen|boy|jeroen|martijn|xander|ruben|daniel|alex|thomas|markus|stefan|jorge|paul/.test(n);
      });
      return candidates[0] || pool[0] || state.voices[0];
    }

    function pitchRateFor(voice, mode) {
      const base = {
        meisje: { pitch: 1.55, rate: 1.05 },
        jongen: { pitch: 1.25, rate: 1.05 },
        vrouw:  { pitch: 1.05, rate: 1.0  },
        man:    { pitch: 0.85, rate: 0.95 }
      }[voice] || { pitch: 1, rate: 1 };
      if (mode === "boos")     { base.rate *= 1.2;  base.pitch += 0.05; }
      if (mode === "schelden") { base.rate *= 1.3;  base.pitch -= 0.05; }
      if (mode === "lief")     { base.rate *= 0.92; }
      return base;
    }

    let mouthInterval = null;
    let watchdogInterval = null;

    function startMouthAnim() {
      stopMouthAnim();
      avatar.classList.add("speaking");
      const mouth = $("mouth");
      const baseRy = state.mode === "schelden" ? 10 : (state.mode === "boos" ? 5 : 6);
      mouthInterval = setInterval(() => {
        const open = Math.random() > 0.35;
        const r = open
          ? baseRy * (1.3 + Math.random() * 0.7)
          : baseRy * (0.2 + Math.random() * 0.3);
        mouth.setAttribute("ry", r.toFixed(1));
      }, 110);
      const startedAt = Date.now();
      watchdogInterval = setInterval(() => {
        if (Date.now() - startedAt < 400) return;
        if (!speechSynthesis.speaking && !speechSynthesis.pending) stopMouthAnim();
      }, 200);
    }

    function stopMouthAnim() {
      avatar.classList.remove("speaking");
      if (mouthInterval)   { clearInterval(mouthInterval);   mouthInterval = null; }
      if (watchdogInterval){ clearInterval(watchdogInterval); watchdogInterval = null; }
      updateFace();
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      stopMouthAnim();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode(state.language);
      const v = pickVoice(state.voice);
      if (v) u.voice = v;
      const { pitch, rate } = pitchRateFor(state.voice, state.mode);
      u.pitch = Math.max(0, Math.min(2, pitch));
      u.rate  = Math.max(0.1, Math.min(2, rate));
      u.onstart = startMouthAnim;
      u.onend   = stopMouthAnim;
      u.onerror = stopMouthAnim;
      speechSynthesis.speak(u);
      // Vangnet: sommige browsers vuren onstart niet altijd af.
      setTimeout(() => {
        if (!mouthInterval && speechSynthesis.speaking) startMouthAnim();
      }, 250);
    }

    function addMessage(role, text, opts) {
      opts = opts || {};
      const chatEl = $("chat");
      const b = document.createElement("div");
      b.className = "msg " + role + (opts.typing ? " typing" : "");
      if (opts.typing) {
        const d = document.createElement("span");
        d.className = "dots";
        b.appendChild(d);
      } else {
        b.textContent = text;
      }
      chatEl.appendChild(b);
      $("emptyState").classList.add("hidden");
      requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
      return b;
    }

    function syncEmptyState() {
      const chatEl = $("chat");
      const emptyEl = $("emptyState");
      if (!chatEl.children.length) {
        emptyEl.classList.remove("hidden");
        renderExamples();
      } else {
        emptyEl.classList.add("hidden");
      }
    }

    function renderHistory() {
      const chatEl = $("chat");
      chatEl.innerHTML = "";
      (history || []).forEach(m => addMessage(m.role, m.content));
      syncEmptyState();
    }

    function clearChatHistory() {
      history = [];
      saveHistory();
      $("chat").innerHTML = "";
      syncEmptyState();
    }

    function randomReply(userText) {
      const lang = state.language;
      const mode = state.mode;
      const theme = detectTheme(userText || "", lang);
      if (theme) {
        const langTheme = (themedResponses[lang] || {})[theme];
        if (langTheme && langTheme[mode] && langTheme[mode].length) {
          const arr = langTheme[mode];
          return arr[Math.floor(Math.random() * arr.length)];
        }
      }
      const langSet = responses[lang] || responses.nl;
      const arr = langSet[mode] || langSet.lief;
      return arr[Math.floor(Math.random() * arr.length)];
    }

    async function reply(userText) {
      history.push({ role: "user", content: userText });
      if (history.length > 40) history = history.slice(-40);
      addMessage("user", userText);
      saveHistory();

      if (settings.aiMode && settings.apiKey) {
        const typing = addMessage("assistant", "", { typing: true });
        avatar.classList.add("speaking");
        try {
          const text = await callClaude();
          typing.remove();
          avatar.classList.remove("speaking");
          addMessage("assistant", text);
          history.push({ role: "assistant", content: text });
          saveHistory();
          speak(text);
        } catch (e) {
          typing.remove();
          avatar.classList.remove("speaking");
          addMessage("assistant", T.err_api + e.message);
        }
      } else {
        const text = randomReply(userText);
        addMessage("assistant", text);
        history.push({ role: "assistant", content: text });
        saveHistory();
        speak(text);
      }
    }

    $("sendBtn").addEventListener("click", () => {
      const v = $("userInput").value.trim();
      $("userInput").value = "";
      if (!v) return;
      reply(v);
    });
    $("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("sendBtn").click();
    });

    // Microfoon (werkt in Chrome, Edge, Safari)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = $("micBtn");
    if (!SR) {
      micBtn.disabled = true;
      micBtn.title = "Microfoon werkt niet in deze browser (probeer Chrome of Safari)";
      micBtn.style.opacity = 0.4;
    } else {
      const rec = new SR();
      rec.lang = langCode(state.language);
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      let listening = false;
      micBtn.addEventListener("click", () => {
        if (listening) { rec.stop(); return; }
        rec.lang = langCode(state.language);
        try { rec.start(); } catch (e) {}
      });
      rec.onstart  = () => { listening = true;  micBtn.classList.add("listening"); };
      rec.onend    = () => { listening = false; micBtn.classList.remove("listening"); };
      rec.onerror  = () => { listening = false; micBtn.classList.remove("listening"); };
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        $("userInput").value = text;
        reply(text);
      };
    }

    // === Instellingen + AI-chat ===
    const settings = {
      aiMode: false,
      apiKey: "",
      model: "claude-haiku-4-5-20251001"
    };
    let history = [];

    function loadSettings() {
      settings.aiMode = localStorage.getItem("boosapp_aimode") === "1";
      settings.apiKey = localStorage.getItem("boosapp_apikey") || "";
      settings.model  = localStorage.getItem("boosapp_model")  || settings.model;
      // Gesprek alleen binnen huidige browser-sessie: weg zodra de tab sluit.
      localStorage.removeItem("boosapp_history"); // oude persistente data opruimen
      try { history = JSON.parse(sessionStorage.getItem("boosapp_history") || "[]"); }
      catch { history = []; }
    }
    function saveSettings() {
      localStorage.setItem("boosapp_aimode", settings.aiMode ? "1" : "0");
      localStorage.setItem("boosapp_apikey", settings.apiKey);
      localStorage.setItem("boosapp_model",  settings.model);
    }
    function saveHistory() {
      sessionStorage.setItem("boosapp_history", JSON.stringify(history.slice(-20)));
    }
    loadSettings();

    const settingsBody  = $("settingsBody");
    const settingsArrow = $("settingsArrow");
    const aiToggle      = $("aiToggle");
    const apiKeyInput   = $("apiKey");
    const modelSelect   = $("modelSelect");

    $("settingsToggle").addEventListener("click", () => {
      const hidden = settingsBody.classList.toggle("hidden");
      settingsArrow.textContent = hidden ? "▾" : "▴";
    });

    function syncSettingsUI() {
      aiToggle.classList.toggle("on", settings.aiMode);
      aiToggle.setAttribute("aria-checked", settings.aiMode ? "true" : "false");
      apiKeyInput.value = settings.apiKey;
      modelSelect.value = settings.model;
    }
    syncSettingsUI();

    aiToggle.addEventListener("click", () => {
      settings.aiMode = !settings.aiMode;
      saveSettings();
      syncSettingsUI();
      if (settings.aiMode && !settings.apiKey) {
        settingsBody.classList.remove("hidden");
        settingsArrow.textContent = "▴";
        apiKeyInput.focus();
      }
    });
    apiKeyInput.addEventListener("change", () => {
      settings.apiKey = apiKeyInput.value.trim();
      saveSettings();
    });
    modelSelect.addEventListener("change", () => {
      settings.model = modelSelect.value;
      saveSettings();
    });
    $("clearChat").addEventListener("click", clearChatHistory);

    function systemPromptForMode(mode, lang) {
      const langName = LANG_NAMES[lang] || "Dutch";
      const base = `Always answer in ${langName}, short (1-2 sentences), in spoken style for TTS. No emoji, no lists, no markdown, no surrounding quote marks.`;
      if (mode === "lief")
        return base + " You are warm, calming and comforting. Help the user relax.";
      if (mode === "boos")
        return base + " You are strict and motivating; give the user a kick in the pants. Not actually hurtful.";
      return base + " You tease the user with mild, culturally appropriate insults in the chosen language (e.g. in Dutch: sukkel/mafkees/oen/pannenkoek; English: doofus/numpty/knucklehead; German: Trottel/Tollpatsch/Schussel; French: nigaud/andouille/cornichon). It may be punchy but never genuinely hurtful; nothing about appearance, family, religion, sexuality or identity.";
    }

    async function callClaude() {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": settings.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
          "content-type": "application/json"
        },
        body: JSON.stringify({
          model: settings.model,
          max_tokens: 200,
          system: [{
            type: "text",
            text: systemPromptForMode(state.mode, state.language),
            cache_control: { type: "ephemeral" }
          }],
          messages: history
        })
      });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json())?.error?.message || ""; } catch {}
        throw new Error(`API ${res.status}${detail ? ": " + detail : ""}`);
      }
      const data = await res.json();
      const text = data.content?.find(c => c.type === "text")?.text?.trim() || "...";
      return text;
    }

    // === Achtergrondmuziek (Web Audio synth, geen bestanden nodig) ===
    let musicOn = localStorage.getItem("boosapp_music") === "1";
    let audioCtx = null;
    let musicMaster = null;
    let musicNodes = [];

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function startMusic() {
      if (musicNodes.length) return;
      const ctx = ensureAudio();
      musicMaster = ctx.createGain();
      musicMaster.gain.value = 0;
      musicMaster.connect(ctx.destination);
      musicMaster.gain.linearRampToValueAtTime(0.10, ctx.currentTime + 2.5);
      // Cmaj9 spread — kalmerend akkoord met zachte LFO's
      const freqs = [130.81, 196.00, 261.63, 329.63, 392.00, 587.33];
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator();
        osc.type = i < 2 ? "triangle" : "sine";
        osc.frequency.value = f;
        const g = ctx.createGain();
        const base = 0.5 / freqs.length;
        g.gain.value = base;
        const lfo = ctx.createOscillator();
        lfo.frequency.value = 0.04 + i * 0.013;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value = base * 0.5;
        lfo.connect(lfoGain).connect(g.gain);
        osc.connect(g).connect(musicMaster);
        osc.start();
        lfo.start();
        musicNodes.push(osc, lfo);
      });
    }

    function stopMusic() {
      if (!musicMaster || !audioCtx) return;
      const ctx = audioCtx;
      musicMaster.gain.cancelScheduledValues(ctx.currentTime);
      musicMaster.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
      const nodes = musicNodes.slice();
      const master = musicMaster;
      musicNodes = [];
      musicMaster = null;
      setTimeout(() => {
        nodes.forEach(n => { try { n.stop(); } catch {} });
        try { master.disconnect(); } catch {}
      }, 900);
    }

    function updateMusicBtn() {
      const mb = $("musicBtn");
      mb.textContent = musicOn ? "🔊" : "🔇";
      mb.title = musicOn ? T.music_on_title : T.music_off_title;
      mb.setAttribute("aria-pressed", musicOn ? "true" : "false");
    }

    $("musicBtn").addEventListener("click", () => {
      musicOn = !musicOn;
      localStorage.setItem("boosapp_music", musicOn ? "1" : "0");
      if (musicOn) startMusic(); else stopMusic();
      updateMusicBtn();
    });

    // Browsers blokkeren AudioContext zonder user-gesture, dus bij herladen
    // wachten we op de eerste klik ergens op de pagina om muziek te starten.
    if (musicOn) {
      const starter = () => {
        if (musicOn && !musicNodes.length) startMusic();
        document.removeEventListener("click", starter);
      };
      document.addEventListener("click", starter);
    }

    // Initiele UI-vertaling toepassen (na mic + muziek-setup zodat alles juiste taal krijgt)
    applyUI();
    updateMusicBtn();
    renderHistory();
  </script>
</body>
</html>
