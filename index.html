<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoosApp — praat met de avatar</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --panel: #ffffff;
      --text: #1a1a1f;
      --muted: #6b7280;
      --accent: #6366f1;
      --soft: #e5e7eb;
      --shadow: 0 10px 30px rgba(20, 20, 60, 0.08);
    }
    [data-theme="dark"] {
      --bg: #0e1117;
      --panel: #1a1f2b;
      --text: #f1f3f8;
      --muted: #9aa3b2;
      --accent: #8b8cf2;
      --soft: #2a313f;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .3s, color .3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; max-width: 720px; margin: 0 auto; width: 100%;
    }
    h1 { font-size: 1.4rem; margin: 0; letter-spacing: -.5px; }
    .theme-btn {
      background: var(--panel); border: 1px solid var(--soft);
      color: var(--text); border-radius: 999px; padding: 8px 14px;
      cursor: pointer; font-size: .9rem; box-shadow: var(--shadow);
    }
    main {
      flex: 1; max-width: 720px; margin: 0 auto; width: 100%;
      padding: 0 20px 32px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .card {
      background: var(--panel); border-radius: 20px;
      padding: 18px; box-shadow: var(--shadow);
      animation: fadeIn .4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* avatar */
    .avatar-wrap { display: flex; justify-content: center; padding: 20px; }
    .avatar { width: 200px; height: 200px; }
    .face { fill: #ffd9a5; transition: fill .4s; }
    body[data-mode="boos"] .face { fill: #ffb39a; }
    body[data-mode="schelden"] .face { fill: #ff8e7a; }
    .eye { fill: #1a1a1f; transition: all .3s; }
    .brow { stroke: #1a1a1f; stroke-width: 5; fill: none; stroke-linecap: round; transition: all .3s; }
    .mouth {
      fill: #5a2a2a;
      transform-box: fill-box;
      transform-origin: center;
      transition: rx .3s, ry .3s;
    }
    .avatar.speaking .mouth {
      animation: mouthMove .22s ease-in-out infinite alternate;
    }
    @keyframes mouthMove {
      from { transform: scaleY(0.3); }
      to   { transform: scaleY(1.4); }
    }

    /* response bubble */
    .response {
      min-height: 60px; padding: 16px 18px;
      font-size: 1.15rem; line-height: 1.5;
      border-radius: 14px; background: var(--bg);
      border: 1px solid var(--soft);
      transition: background .3s;
    }
    .response.empty { color: var(--muted); font-style: italic; }
    .response.pop { animation: pop .35s ease-out; }
    @keyframes pop {
      0%   { transform: scale(.96); opacity: .6; }
      60%  { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* input */
    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--soft); background: var(--bg); color: var(--text);
      font-size: 1rem; outline: none; transition: border-color .2s;
    }
    .input-row input:focus { border-color: var(--accent); }

    .btn {
      padding: 12px 18px; border-radius: 12px; border: none;
      background: var(--accent); color: white; cursor: pointer;
      font-size: 1rem; font-weight: 600;
      transition: transform .1s, opacity .2s;
    }
    .btn:hover { opacity: .92; }
    .btn:active { transform: scale(.97); }
    .btn.icon { padding: 12px 14px; font-size: 1.1rem; }
    .mic { background: #ef4444; }
    .mic.listening { animation: pulse 1.1s infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.55); }
      50%     { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--soft); background: var(--bg);
      color: var(--text); cursor: pointer; font-size: .92rem;
      transition: all .2s;
    }
    .chip:hover { transform: translateY(-1px); }
    .chip.active {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .label { font-size: .82rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }

    /* instellingen */
    .settings-toggle {
      background: var(--soft); color: var(--text); border: none;
      border-radius: 12px; padding: 12px 16px; cursor: pointer;
      width: 100%; font-size: 1rem; text-align: left;
      display: flex; justify-content: space-between; align-items: center;
    }
    .settings-body { padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
    .settings-body.hidden { display: none; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: .85rem; color: var(--muted); }
    .field input, .field select {
      padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--soft); background: var(--bg); color: var(--text);
      font-size: .95rem; outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch {
      width: 44px; height: 26px; background: var(--soft); border-radius: 999px;
      position: relative; cursor: pointer; transition: background .2s;
      flex-shrink: 0; border: none; padding: 0;
    }
    .switch::after {
      content: ''; width: 20px; height: 20px; background: white;
      border-radius: 50%; position: absolute; top: 3px; left: 3px;
      transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(18px); }
    .btn.small { padding: 8px 12px; font-size: .85rem; }
    .btn.danger { background: #ef4444; }
    .help { font-size: .8rem; color: var(--muted); line-height: 1.4; }
    .help a { color: var(--accent); }
    .dots { display: inline-block; min-width: 24px; }
    .dots::after { content: '...'; animation: dots 1.2s infinite steps(4, end); }
    @keyframes dots {
      0%        { content: ''; }
      25%       { content: '.'; }
      50%       { content: '..'; }
      75%, 100% { content: '...'; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.1rem; }
      .avatar { width: 160px; height: 160px; }
      .response { font-size: 1.05rem; }
      .btn { padding: 12px 14px; font-size: .95rem; }
    }
  </style>
</head>
<body data-theme="light" data-mode="lief">
  <header>
    <h1>🫧 BoosApp</h1>
    <button class="theme-btn" id="themeBtn">🌙 Donker</button>
  </header>

  <main>
    <div class="card avatar-wrap">
      <svg class="avatar" id="avatar" viewBox="0 0 200 200">
        <circle class="face" cx="100" cy="100" r="80"/>
        <ellipse class="eye" id="eyeL" cx="75" cy="92" rx="6" ry="8"/>
        <ellipse class="eye" id="eyeR" cx="125" cy="92" rx="6" ry="8"/>
        <path class="brow" id="browL" d="M 60 72 Q 75 67 90 72"/>
        <path class="brow" id="browR" d="M 110 72 Q 125 67 140 72"/>
        <ellipse class="mouth" id="mouth" cx="100" cy="135" rx="18" ry="6"/>
      </svg>
    </div>

    <div class="card">
      <div class="response empty" id="response">Typ iets of druk op de microfoon...</div>
    </div>

    <div class="card">
      <div class="input-row">
        <input type="text" id="userInput" placeholder="Wat wil je zeggen?" autocomplete="off" />
        <button class="btn icon mic" id="micBtn" title="Praat tegen de app">🎤</button>
        <button class="btn" id="sendBtn">Stuur</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Mode</div>
      <div class="chips" id="modeChips">
        <button class="chip active" data-mode="lief">😊 Lief</button>
        <button class="chip" data-mode="boos">😤 Boos</button>
        <button class="chip" data-mode="schelden">🤬 Scheldwoorden</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Stem</div>
      <div class="chips" id="voiceChips">
        <button class="chip" data-voice="meisje">👧 Meisje</button>
        <button class="chip" data-voice="jongen">👦 Jongen</button>
        <button class="chip active" data-voice="vrouw">👩 Vrouw</button>
        <button class="chip" data-voice="man">👨 Man</button>
      </div>
    </div>

    <div class="card">
      <button class="settings-toggle" id="settingsToggle">
        <span>⚙️ Instellingen</span>
        <span id="settingsArrow">▾</span>
      </button>
      <div class="settings-body hidden" id="settingsBody">
        <div class="row">
          <label for="aiToggle">AI-modus (echte gesprekken)</label>
          <button class="switch" id="aiToggle" role="switch" aria-checked="false" aria-label="AI-modus"></button>
        </div>
        <div class="field">
          <label for="apiKey">Claude API-key</label>
          <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
          <div class="help">
            Maak er gratis een aan op <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> (Settings → API Keys).
            De key wordt alleen op dit apparaat opgeslagen.
          </div>
        </div>
        <div class="field">
          <label for="modelSelect">Model</label>
          <select id="modelSelect">
            <option value="claude-haiku-4-5-20251001">Haiku 4.5 — snel & goedkoop</option>
            <option value="claude-sonnet-4-6">Sonnet 4.6 — slimmer, iets duurder</option>
          </select>
        </div>
        <button class="btn small danger" id="clearChat">🗑️ Wis gesprek-geheugen</button>
      </div>
    </div>
  </main>

  <script>
    // Antwoorden per mode — voeg hier gerust eigen zinnen aan toe!
    const responses = {
      lief: [
        "Het komt goed, ik ben bij je. ❤️",
        "Adem rustig in... en uit.",
        "Je bent niet alleen, ik luister.",
        "Wat fijn dat je iets zegt.",
        "Neem je tijd, geen haast.",
        "Je doet het goed, echt waar.",
        "Even pauze, dat mag."
      ],
      boos: [
        "Kom op nou, doorzetten!",
        "Dit laat je niet zomaar los!",
        "Niet kennen geven, ga ervoor!",
        "Zet door, ook al is het zwaar.",
        "Hé! Wakker blijven!",
        "Sta op en ga ervoor!"
      ],
      schelden: [
        "Sukkel, wat ben je nou aan het doen?!",
        "Ben je helemaal gek geworden?!",
        "Doe even normaal, mafkees!",
        "Wakker worden, sukkel!",
        "Hallo?! Ben je daar nog?!",
        "Pannenkoek! Schiet eens op!"
      ]
    };

    const state = { mode: "lief", voice: "vrouw", theme: "light", voices: [] };
    const $ = (id) => document.getElementById(id);
    const avatar = $("avatar");
    const responseEl = $("response");

    // Donker / licht
    $("themeBtn").addEventListener("click", () => {
      state.theme = state.theme === "light" ? "dark" : "light";
      document.body.dataset.theme = state.theme;
      $("themeBtn").textContent = state.theme === "light" ? "🌙 Donker" : "☀️ Licht";
    });

    // Knoppen-rijtjes (mode / stem)
    function setupChips(containerId, attr, onChange) {
      const container = $(containerId);
      container.addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        container.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        onChange(chip.dataset[attr]);
      });
    }
    setupChips("modeChips", "mode", (m) => {
      state.mode = m;
      document.body.dataset.mode = m;
      updateFace();
    });
    setupChips("voiceChips", "voice", (v) => { state.voice = v; });

    // Gezichtsuitdrukking per mode
    function updateFace() {
      const browL = $("browL"), browR = $("browR"), mouth = $("mouth");
      if (state.mode === "lief") {
        browL.setAttribute("d", "M 60 72 Q 75 67 90 72");
        browR.setAttribute("d", "M 110 72 Q 125 67 140 72");
        mouth.setAttribute("rx", "18"); mouth.setAttribute("ry", "6");
      } else if (state.mode === "boos") {
        browL.setAttribute("d", "M 60 65 L 90 78");
        browR.setAttribute("d", "M 110 78 L 140 65");
        mouth.setAttribute("rx", "22"); mouth.setAttribute("ry", "5");
      } else {
        browL.setAttribute("d", "M 56 60 L 92 80");
        browR.setAttribute("d", "M 108 80 L 144 60");
        mouth.setAttribute("rx", "26"); mouth.setAttribute("ry", "10");
      }
    }
    updateFace();

    // Stemmen laden (browser laadt ze asynchroon)
    function loadVoices() { state.voices = speechSynthesis.getVoices(); }
    loadVoices();
    if (typeof speechSynthesis !== "undefined") {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickVoice(name) {
      const dutch = state.voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("nl"));
      const pool = dutch.length ? dutch : state.voices;
      const wantsFemale = name === "meisje" || name === "vrouw";
      const candidates = pool.filter(v => {
        const n = v.name.toLowerCase();
        if (wantsFemale) return /female|vrouw|fem|woman|girl|anna|lotte|claire|hanna|saskia|ellen/.test(n);
        return /male|man|jongen|boy|jeroen|martijn|xander|ruben|daniel/.test(n);
      });
      return candidates[0] || pool[0] || state.voices[0];
    }

    function pitchRateFor(voice, mode) {
      const base = {
        meisje: { pitch: 1.55, rate: 1.05 },
        jongen: { pitch: 1.25, rate: 1.05 },
        vrouw:  { pitch: 1.05, rate: 1.0  },
        man:    { pitch: 0.85, rate: 0.95 }
      }[voice] || { pitch: 1, rate: 1 };
      if (mode === "boos")     { base.rate *= 1.2;  base.pitch += 0.05; }
      if (mode === "schelden") { base.rate *= 1.3;  base.pitch -= 0.05; }
      if (mode === "lief")     { base.rate *= 0.92; }
      return base;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "nl-NL";
      const v = pickVoice(state.voice);
      if (v) u.voice = v;
      const { pitch, rate } = pitchRateFor(state.voice, state.mode);
      u.pitch = Math.max(0, Math.min(2, pitch));
      u.rate  = Math.max(0.1, Math.min(2, rate));
      u.onstart = () => avatar.classList.add("speaking");
      u.onend   = () => avatar.classList.remove("speaking");
      u.onerror = () => avatar.classList.remove("speaking");
      speechSynthesis.speak(u);
    }

    function showResponse(text) {
      responseEl.textContent = text;
      responseEl.classList.remove("empty", "pop");
      void responseEl.offsetWidth;
      responseEl.classList.add("pop");
    }

    function randomReply() {
      const arr = responses[state.mode];
      return arr[Math.floor(Math.random() * arr.length)];
    }

    async function reply(userText) {
      if (settings.aiMode && settings.apiKey) {
        responseEl.classList.remove("empty", "pop");
        responseEl.innerHTML = '<span class="dots"></span>';
        avatar.classList.add("speaking");
        try {
          const text = await callClaude(userText);
          avatar.classList.remove("speaking");
          showResponse(text);
          speak(text);
        } catch (e) {
          avatar.classList.remove("speaking");
          showResponse("Oeps, kon Claude niet bereiken. " + e.message);
        }
      } else {
        const text = randomReply();
        showResponse(text);
        speak(text);
      }
    }

    $("sendBtn").addEventListener("click", () => {
      const v = $("userInput").value.trim();
      $("userInput").value = "";
      if (!v) return;
      reply(v);
    });
    $("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("sendBtn").click();
    });

    // Microfoon (werkt in Chrome, Edge, Safari)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = $("micBtn");
    if (!SR) {
      micBtn.disabled = true;
      micBtn.title = "Microfoon werkt niet in deze browser (probeer Chrome of Safari)";
      micBtn.style.opacity = 0.4;
    } else {
      const rec = new SR();
      rec.lang = "nl-NL";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      let listening = false;
      micBtn.addEventListener("click", () => {
        if (listening) { rec.stop(); return; }
        try { rec.start(); } catch (e) {}
      });
      rec.onstart  = () => { listening = true;  micBtn.classList.add("listening"); };
      rec.onend    = () => { listening = false; micBtn.classList.remove("listening"); };
      rec.onerror  = () => { listening = false; micBtn.classList.remove("listening"); };
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        $("userInput").value = text;
        reply(text);
      };
    }

    // === Instellingen + AI-chat ===
    const settings = {
      aiMode: false,
      apiKey: "",
      model: "claude-haiku-4-5-20251001"
    };
    let history = [];

    function loadSettings() {
      settings.aiMode = localStorage.getItem("boosapp_aimode") === "1";
      settings.apiKey = localStorage.getItem("boosapp_apikey") || "";
      settings.model  = localStorage.getItem("boosapp_model")  || settings.model;
      try { history = JSON.parse(localStorage.getItem("boosapp_history") || "[]"); }
      catch { history = []; }
    }
    function saveSettings() {
      localStorage.setItem("boosapp_aimode", settings.aiMode ? "1" : "0");
      localStorage.setItem("boosapp_apikey", settings.apiKey);
      localStorage.setItem("boosapp_model",  settings.model);
    }
    function saveHistory() {
      localStorage.setItem("boosapp_history", JSON.stringify(history.slice(-20)));
    }
    loadSettings();

    const settingsBody  = $("settingsBody");
    const settingsArrow = $("settingsArrow");
    const aiToggle      = $("aiToggle");
    const apiKeyInput   = $("apiKey");
    const modelSelect   = $("modelSelect");

    $("settingsToggle").addEventListener("click", () => {
      const hidden = settingsBody.classList.toggle("hidden");
      settingsArrow.textContent = hidden ? "▾" : "▴";
    });

    function syncSettingsUI() {
      aiToggle.classList.toggle("on", settings.aiMode);
      aiToggle.setAttribute("aria-checked", settings.aiMode ? "true" : "false");
      apiKeyInput.value = settings.apiKey;
      modelSelect.value = settings.model;
    }
    syncSettingsUI();

    aiToggle.addEventListener("click", () => {
      settings.aiMode = !settings.aiMode;
      saveSettings();
      syncSettingsUI();
      if (settings.aiMode && !settings.apiKey) {
        settingsBody.classList.remove("hidden");
        settingsArrow.textContent = "▴";
        apiKeyInput.focus();
      }
    });
    apiKeyInput.addEventListener("change", () => {
      settings.apiKey = apiKeyInput.value.trim();
      saveSettings();
    });
    modelSelect.addEventListener("change", () => {
      settings.model = modelSelect.value;
      saveSettings();
    });
    $("clearChat").addEventListener("click", () => {
      history = [];
      saveHistory();
      showResponse("Gesprek-geheugen gewist.");
    });

    function systemPromptForMode(mode) {
      const base = "Antwoord altijd in het Nederlands, kort (1-2 zinnen), in spreektaal die wordt voorgelezen door TTS. Geen emoji's, geen opsommingen, geen markdown, geen aanhalingstekens om het antwoord.";
      if (mode === "lief")
        return base + " Je bent warm, kalmerend en troostend. Help de gebruiker rustig worden.";
      if (mode === "boos")
        return base + " Je bent streng en motiverend; je geeft de gebruiker een schop onder de kont. Niet écht kwetsend.";
      return base + " Je scheldt de gebruiker grappig uit met milde Nederlandse scheldwoorden (sukkel, mafkees, oen, pannenkoek, sufferd). Het mag pittig maar nooit écht kwetsend; geen scheldwoorden over uiterlijk, familie, geloof, geaardheid of identiteit.";
    }

    async function callClaude(userText) {
      history.push({ role: "user", content: userText });
      if (history.length > 20) history = history.slice(-20);

      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": settings.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
          "content-type": "application/json"
        },
        body: JSON.stringify({
          model: settings.model,
          max_tokens: 200,
          system: [{
            type: "text",
            text: systemPromptForMode(state.mode),
            cache_control: { type: "ephemeral" }
          }],
          messages: history
        })
      });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json())?.error?.message || ""; } catch {}
        throw new Error(`API ${res.status}${detail ? ": " + detail : ""}`);
      }
      const data = await res.json();
      const text = data.content?.find(c => c.type === "text")?.text?.trim() || "...";
      history.push({ role: "assistant", content: text });
      saveHistory();
      return text;
    }
  </script>
</body>
</html>
