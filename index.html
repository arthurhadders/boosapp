<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoosApp — praat met de avatar</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --panel: #ffffff;
      --text: #1a1a1f;
      --muted: #6b7280;
      --accent: #6366f1;
      --soft: #e5e7eb;
      --shadow: 0 10px 30px rgba(20, 20, 60, 0.08);
    }
    [data-theme="dark"] {
      --bg: #0e1117;
      --panel: #1a1f2b;
      --text: #f1f3f8;
      --muted: #9aa3b2;
      --accent: #8b8cf2;
      --soft: #2a313f;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .3s, color .3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; max-width: 720px; margin: 0 auto; width: 100%;
    }
    h1 { font-size: 1.4rem; margin: 0; letter-spacing: -.5px; }
    .theme-btn {
      background: var(--panel); border: 1px solid var(--soft);
      color: var(--text); border-radius: 999px; padding: 8px 14px;
      cursor: pointer; font-size: .9rem; box-shadow: var(--shadow);
    }
    main {
      flex: 1; max-width: 720px; margin: 0 auto; width: 100%;
      padding: 0 20px 32px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .card {
      background: var(--panel); border-radius: 20px;
      padding: 18px; box-shadow: var(--shadow);
      animation: fadeIn .4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* avatar */
    .avatar-wrap { display: flex; justify-content: center; padding: 20px; }
    .avatar { width: 200px; height: 200px; }
    .face { fill: #ffd9a5; transition: fill .4s; }
    body[data-mode="boos"] .face { fill: #ffb39a; }
    body[data-mode="schelden"] .face { fill: #ff8e7a; }
    .eye { fill: #1a1a1f; transition: all .3s; }
    .brow { stroke: #1a1a1f; stroke-width: 5; fill: none; stroke-linecap: round; transition: all .3s; }
    .mouth {
      fill: #5a2a2a;
      transition: ry .08s ease-out, rx .3s;
    }
    .avatar.speaking { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2px); }
    }

    /* response bubble */
    .response {
      min-height: 60px; padding: 16px 18px;
      font-size: 1.15rem; line-height: 1.5;
      border-radius: 14px; background: var(--bg);
      border: 1px solid var(--soft);
      transition: background .3s;
    }
    .response.empty { color: var(--muted); font-style: italic; }
    .response.pop { animation: pop .35s ease-out; }
    @keyframes pop {
      0%   { transform: scale(.96); opacity: .6; }
      60%  { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* input */
    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--soft); background: var(--bg); color: var(--text);
      font-size: 1rem; outline: none; transition: border-color .2s;
    }
    .input-row input:focus { border-color: var(--accent); }

    .btn {
      padding: 12px 18px; border-radius: 12px; border: none;
      background: var(--accent); color: white; cursor: pointer;
      font-size: 1rem; font-weight: 600;
      transition: transform .1s, opacity .2s;
    }
    .btn:hover { opacity: .92; }
    .btn:active { transform: scale(.97); }
    .btn.icon { padding: 12px 14px; font-size: 1.1rem; }
    .mic { background: #ef4444; }
    .mic.listening { animation: pulse 1.1s infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.55); }
      50%     { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--soft); background: var(--bg);
      color: var(--text); cursor: pointer; font-size: .92rem;
      transition: all .2s;
    }
    .chip:hover { transform: translateY(-1px); }
    .chip.active {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .label { font-size: .82rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }

    /* instellingen */
    .settings-toggle {
      background: var(--soft); color: var(--text); border: none;
      border-radius: 12px; padding: 12px 16px; cursor: pointer;
      width: 100%; font-size: 1rem; text-align: left;
      display: flex; justify-content: space-between; align-items: center;
    }
    .settings-body { padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
    .settings-body.hidden { display: none; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: .85rem; color: var(--muted); }
    .field input, .field select {
      padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--soft); background: var(--bg); color: var(--text);
      font-size: .95rem; outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch {
      width: 44px; height: 26px; background: var(--soft); border-radius: 999px;
      position: relative; cursor: pointer; transition: background .2s;
      flex-shrink: 0; border: none; padding: 0;
    }
    .switch::after {
      content: ''; width: 20px; height: 20px; background: white;
      border-radius: 50%; position: absolute; top: 3px; left: 3px;
      transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(18px); }
    .btn.small { padding: 8px 12px; font-size: .85rem; }
    .btn.danger { background: #ef4444; }
    .help { font-size: .8rem; color: var(--muted); line-height: 1.4; }
    .help a { color: var(--accent); }
    .dots { display: inline-block; min-width: 24px; }
    .dots::after { content: '...'; animation: dots 1.2s infinite steps(4, end); }
    @keyframes dots {
      0%        { content: ''; }
      25%       { content: '.'; }
      50%       { content: '..'; }
      75%, 100% { content: '...'; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.1rem; }
      .avatar { width: 160px; height: 160px; }
      .response { font-size: 1.05rem; }
      .btn { padding: 12px 14px; font-size: .95rem; }
    }
  </style>
</head>

    </div>

        </div>
        <div class="field">

      ],
      schelden: [

        "Ne sois pas mou, andouille!",

     }
    };

    const state = { mode: "lief", voice: "vrouw", language: "nl", theme: "light", voices: [] };

    const LANG_CODES = { nl: "nl-NL", en: "en-US", de: "de-DE", fr: "fr-FR" };
    const LANG_NAMES = { nl: "Dutch", en: "English", de: "German", fr: "French" };
    const langCode = (l) => LANG_CODES[l] || "nl-NL";

    // UI vertalingen
    const ui = {
      nl: {
        theme_dark: "🌙 Donker", theme_light: "☀️ Licht",
        response_empty: "Typ iets of druk op de microfoon...",
        response_cleared: "Gesprek-geheugen gewist.",

        settings_apikey_label: "Clé API Claude",
        settings_apikey_help: 'Obtiens-en une gratuitement sur <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> (Settings → API Keys). La clé est stockée uniquement sur cet appareil.',

    let T = ui.nl;

    function applyUI() {
      T = ui[state.language] || ui.nl;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        const val = T[key];
        if (val === undefined) return;
        if (val.indexOf("<") !== -1) el.innerHTML = val;
        else el.textContent = val;
      });
      const inp = document.getElementById("userInput");
      if (inp) inp.placeholder = T.input_placeholder;
      const mb = document.getElementById("micBtn");
      if (mb) mb.title = mb.disabled ? T.mic_disabled_title : T.mic_title;
      const tb = document.getElementById("themeBtn");
      if (tb) tb.textContent = (state.theme === "light") ? T.theme_dark : T.theme_light;
      const resp = document.getElementById("response");
      if (resp && resp.classList.contains("empty")) resp.textContent = T.response_empty;
      document.documentElement.lang = state.language;
    }

    const $ = (id) => document.getElementById(id);
    const avatar = $("avatar");
    const responseEl = $("response");

    // Donker / licht
    $("themeBtn").addEventListener("click", () => {
      state.theme = state.theme === "light" ? "dark" : "light";
      document.body.dataset.theme = state.theme;
      $("themeBtn").textContent = state.theme === "light" ? T.theme_dark : T.theme_light;
    });

    // Knoppen-rijtjes (mode / stem)
    function setupChips(containerId, attr, onChange) {
      const container = $(containerId);
      container.addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        container.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        onChange(chip.dataset[attr]);
      });
    }
    setupChips("modeChips", "mode", (m) => {
      state.mode = m;
      document.body.dataset.mode = m;
      updateFace();
    });
    setupChips("voiceChips", "voice", (v) => { state.voice = v; });
    setupChips("languageChips", "language", (l) => { state.language = l; applyUI(); });

    // Gezichtsuitdrukking per mode
    function updateFace() {
      const browL = $("browL"), browR = $("browR"), mouth = $("mouth");
      if (state.mode === "lief") {
        browL.setAttribute("d", "M 60 72 Q 75 67 90 72");
        browR.setAttribute("d", "M 110 72 Q 125 67 140 72");
        mouth.setAttribute("rx", "18"); mouth.setAttribute("ry", "6");
      } else if (state.mode === "boos") {
        browL.setAttribute("d", "M 60 65 L 90 78");
        browR.setAttribute("d", "M 110 78 L 140 65");
        mouth.setAttribute("rx", "22"); mouth.setAttribute("ry", "5");
      } else {
        browL.setAttribute("d", "M 56 60 L 92 80");
        browR.setAttribute("d", "M 108 80 L 144 60");
        mouth.setAttribute("rx", "26"); mouth.setAttribute("ry", "10");
      }
    }
    updateFace();

    // Stemmen laden (browser laadt ze asynchroon)
    function loadVoices() { state.voices = speechSynthesis.getVoices(); }
    loadVoices();
    if (typeof speechSynthesis !== "undefined") {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickVoice(name) {
      const prefix = state.language;
      const inLang = state.voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      const pool = inLang.length ? inLang : state.voices;
      const wantsFemale = name === "meisje" || name === "vrouw";
      const candidates = pool.filter(v => {
        const n = v.name.toLowerCase();
        if (wantsFemale) return /female|vrouw|fem|woman|girl|anna|lotte|claire|hanna|saskia|ellen|samantha|karen|amelie|amélie|audrey|marie|petra|katrin/.test(n);
        return /male|man|jongen|boy|jeroen|martijn|xander|ruben|daniel|alex|thomas|markus|stefan|jorge|paul/.test(n);
      });
      return candidates[0] || pool[0] || state.voices[0];
    }

    function pitchRateFor(voice, mode) {
      const base = {
        meisje: { pitch: 1.55, rate: 1.05 },
        jongen: { pitch: 1.25, rate: 1.05 },
        vrouw:  { pitch: 1.05, rate: 1.0  },
        man:    { pitch: 0.85, rate: 0.95 }
      }[voice] || { pitch: 1, rate: 1 };
      if (mode === "boos")     { base.rate *= 1.2;  base.pitch += 0.05; }
      if (mode === "schelden") { base.rate *= 1.3;  base.pitch -= 0.05; }
      if (mode === "lief")     { base.rate *= 0.92; }
      return base;
    }

    let mouthInterval = null;
    let watchdogInterval = null;

    function startMouthAnim() {
      stopMouthAnim();
      avatar.classList.add("speaking");
      const mouth = $("mouth");
      const baseRy = state.mode === "schelden" ? 10 : (state.mode === "boos" ? 5 : 6);
      mouthInterval = setInterval(() => {
        const open = Math.random() > 0.35;
        const r = open
          ? baseRy * (1.3 + Math.random() * 0.7)
          : baseRy * (0.2 + Math.random() * 0.3);
        mouth.setAttribute("ry", r.toFixed(1));
      }, 110);
      const startedAt = Date.now();
      watchdogInterval = setInterval(() => {
        if (Date.now() - startedAt < 400) return;
        if (!speechSynthesis.speaking && !speechSynthesis.pending) stopMouthAnim();
      }, 200);
    }

    function stopMouthAnim() {
      avatar.classList.remove("speaking");
      if (mouthInterval)   { clearInterval(mouthInterval);   mouthInterval = null; }
      if (watchdogInterval){ clearInterval(watchdogInterval); watchdogInterval = null; }
      updateFace();
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      stopMouthAnim();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode(state.language);
      const v = pickVoice(state.voice);
      if (v) u.voice = v;
      const { pitch, rate } = pitchRateFor(state.voice, state.mode);
      u.pitch = Math.max(0, Math.min(2, pitch));
      u.rate  = Math.max(0.1, Math.min(2, rate));
      u.onstart = startMouthAnim;
      u.onend   = stopMouthAnim;
      u.onerror = stopMouthAnim;
      speechSynthesis.speak(u);
      // Vangnet: sommige browsers vuren onstart niet altijd af.
      setTimeout(() => {
        if (!mouthInterval && speechSynthesis.speaking) startMouthAnim();
      }, 250);
    }

    function showResponse(text) {
      responseEl.textContent = text;
      responseEl.classList.remove("empty", "pop");
      void responseEl.offsetWidth;
      responseEl.classList.add("pop");
    }

    function randomReply() {
      const langSet = responses[state.language] || responses.nl;
      const arr = langSet[state.mode] || langSet.lief;
      return arr[Math.floor(Math.random() * arr.length)];
    }

    async function reply(userText) {
      if (settings.aiMode && settings.apiKey) {
        responseEl.classList.remove("empty", "pop");
        responseEl.innerHTML = '<span class="dots"></span>';
        avatar.classList.add("speaking");
        try {
          const text = await callClaude(userText);
          avatar.classList.remove("speaking");
          showResponse(text);
          speak(text);
        } catch (e) {
          avatar.classList.remove("speaking");
          showResponse(T.err_api + e.message);
        }
      } else {
        const text = randomReply();
        showResponse(text);
        speak(text);
      }
    }

    $("sendBtn").addEventListener("click", () => {
      const v = $("userInput").value.trim();
      $("userInput").value = "";
      if (!v) return;
      reply(v);
    });
    $("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("sendBtn").click();
    });

    // Microfoon (werkt in Chrome, Edge, Safari)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = $("micBtn");
    if (!SR) {
      micBtn.disabled = true;
      micBtn.title = "Microfoon werkt niet in deze browser (probeer Chrome of Safari)";
      micBtn.style.opacity = 0.4;
    } else {
      const rec = new SR();
      rec.lang = langCode(state.language);
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      let listening = false;
      micBtn.addEventListener("click", () => {
        if (listening) { rec.stop(); return; }
        rec.lang = langCode(state.language);
        try { rec.start(); } catch (e) {}
      });
      rec.onstart  = () => { listening = true;  micBtn.classList.add("listening"); };
      rec.onend    = () => { listening = false; micBtn.classList.remove("listening"); };
      rec.onerror  = () => { listening = false; micBtn.classList.remove("listening"); };
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        $("userInput").value = text;
        reply(text);
      };
    }

    // === Instellingen + AI-chat ===
    const settings = {
      aiMode: false,
      apiKey: "",
      model: "claude-haiku-4-5-20251001"
    };
    let history = [];

    function loadSettings() {
      settings.aiMode = localStorage.getItem("boosapp_aimode") === "1";
      settings.apiKey = localStorage.getItem("boosapp_apikey") || "";
      settings.model  = localStorage.getItem("boosapp_model")  || settings.model;
      try { history = JSON.parse(localStorage.getItem("boosapp_history") || "[]"); }
      catch { history = []; }
    }
    function saveSettings() {
      localStorage.setItem("boosapp_aimode", settings.aiMode ? "1" : "0");
      localStorage.setItem("boosapp_apikey", settings.apiKey);
      localStorage.setItem("boosapp_model",  settings.model);
    }
    function saveHistory() {
      localStorage.setItem("boosapp_history", JSON.stringify(history.slice(-20)));
    }
    loadSettings();

    const settingsBody  = $("settingsBody");
    const settingsArrow = $("settingsArrow");
    const aiToggle      = $("aiToggle");
    const apiKeyInput   = $("apiKey");
    const modelSelect   = $("modelSelect");

    $("settingsToggle").addEventListener("click", () => {
      const hidden = settingsBody.classList.toggle("hidden");
      settingsArrow.textContent = hidden ? "▾" : "▴";
    });

    function syncSettingsUI() {
      aiToggle.classList.toggle("on", settings.aiMode);
      aiToggle.setAttribute("aria-checked", settings.aiMode ? "true" : "false");
      apiKeyInput.value = settings.apiKey;
      modelSelect.value = settings.model;
    }
    syncSettingsUI();

    aiToggle.addEventListener("click", () => {
      settings.aiMode = !settings.aiMode;
      saveSettings();
      syncSettingsUI();
      if (settings.aiMode && !settings.apiKey) {
        settingsBody.classList.remove("hidden");
        settingsArrow.textContent = "▴";
        apiKeyInput.focus();
      }
    });
    apiKeyInput.addEventListener("change", () => {
      settings.apiKey = apiKeyInput.value.trim();
      saveSettings();
    });
    modelSelect.addEventListener("change", () => {
      settings.model = modelSelect.value;
      saveSettings();
    });
    $("clearChat").addEventListener("click", () => {
      history = [];
      saveHistory();
      showResponse(T.response_cleared);
    });

    function systemPromptForMode(mode, lang) {
      const langName = LANG_NAMES[lang] || "Dutch";
      const base = `Always answer in ${langName}, short (1-2 sentences), in spoken style for TTS. No emoji, no lists, no markdown, no surrounding quote marks.`;
      if (mode === "lief")
        return base + " You are warm, calming and comforting. Help the user relax.";
      if (mode === "boos")
        return base + " You are strict and motivating; give the user a kick in the pants. Not actually hurtful.";
      return base + " You tease the user with mild, culturally appropriate insults in the chosen language (e.g. in Dutch: sukkel/mafkees/oen/pannenkoek; English: doofus/numpty/knucklehead; German: Trottel/Tollpatsch/Schussel; French: nigaud/andouille/cornichon). It may be punchy but never genuinely hurtful; nothing about appearance, family, religion, sexuality or identity.";
    }

    async function callClaude(userText) {
      history.push({ role: "user", content: userText });
      if (history.length > 20) history = history.slice(-20);

      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": settings.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
          "content-type": "application/json"
        },
        body: JSON.stringify({
          model: settings.model,
          max_tokens: 200,
          system: [{
            type: "text",
            text: systemPromptForMode(state.mode, state.language),
            cache_control: { type: "ephemeral" }
          }],
          messages: history
        })
      });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json())?.error?.message || ""; } catch {}
        throw new Error(`API ${res.status}${detail ? ": " + detail : ""}`);
      }
      const data = await res.json();
      const text = data.content?.find(c => c.type === "text")?.text?.trim() || "...";
      history.push({ role: "assistant", content: text });
      saveHistory();
      return text;
    }

    // Initiele UI-vertaling toepassen (na mic-setup zodat de juiste mic-title gekozen wordt)
    applyUI();
  </script>
